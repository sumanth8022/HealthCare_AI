<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Patient - HealthCare MS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <span>❤️ HealthCare MS</span>
    <div>
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>

<div class="wrapper">

<!-- Sidebar -->
<div class="sidebar">
    <div class="menu-title">MENU</div>
    <a th:href="@{/dashboard}">🏠 Dashboard</a>
    <div class="menu-title">PATIENTS</div>
    <a th:href="@{/patients}">All Patients</a>
    <a th:href="@{/patients/add}">Register Patient</a>
    <a th:href="@{/patients/search}">Search Patient</a>
    <div class="menu-title">DOCTORS</div>
    <a th:href="@{/doctors}">All Doctors</a>
    <a th:href="@{/doctors/add}">Add Doctor</a>
    <div class="menu-title">APPOINTMENTS</div>
    <a th:href="@{/appointments}">All Appointments</a>
    <a th:href="@{/appointments/book}">Book Appointment</a>
</div>

<!-- Main Content -->
<div class="main">
    <h1>Register Patient</h1>

    <div class="form-box">
        <form th:action="@{/patients/add}" 
              th:object="${patient}" 
              method="post" id="patientForm">

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" 
                           th:field="*{fullName}" 
                           placeholder="Enter full name" id="fullName"/>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" 
                           th:field="*{age}" 
                           placeholder="Age"  id="age"/>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select th:field="*{gender}" id="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" 
                           th:field="*{phone}" 
                           placeholder="Phone number" id="phone" />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" 
                           th:field="*{email}" 
                           placeholder="Email address" />
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea th:field="*{address}" 
                          placeholder="Address"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Disease / Condition</label>
                    <input type="text" 
                           th:field="*{disease}" 
                           placeholder="e.g. Diabetes" id="disease"/>
                </div>
                <div class="form-group">
                    <label>Blood Group</label>
                    <select th:field="*{bloodGroup}">
                        <option value="">Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select th:field="*{status}">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="form-buttons">
            
                <button type="submit" id="patientBtn">Register Patient</button>
                <a th:href="@{/patients}">Cancel</a>
            </div>

        </form>
    </div>
</div>
</div>
<script th:src="@{/Script/script.js}"></script>
</body>
</html>

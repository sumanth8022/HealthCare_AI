<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Doctor - HealthCare MS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <span>❤️ HealthCare MS</span>
    <div>
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>

<div class="wrapper">

<!-- Sidebar -->
<div class="sidebar">
    <div class="menu-title">MENU</div>
    <a th:href="@{/dashboard}">🏠 Dashboard</a>
    <div class="menu-title">PATIENTS</div>
    <a th:href="@{/patients}">All Patients</a>
    <a th:href="@{/patients/add}">Register Patient</a>
    <a th:href="@{/patients/search}">Search Patient</a>
    <div class="menu-title">DOCTORS</div>
    <a th:href="@{/doctors}">All Doctors</a>
    <a th:href="@{/doctors/add}">Add Doctor</a>
    <div class="menu-title">APPOINTMENTS</div>
    <a th:href="@{/appointments}">All Appointments</a>
    <a th:href="@{/appointments/book}">Book Appointment</a>
</div>

<!-- Main Content -->
<div class="main">
    <h1>Add Doctor</h1>

    <div class="form-box">
        <form th:action="@{/doctors/add}" 
              th:object="${doctor}" 
              method="post" id="doctorForm">

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" 
                           th:field="*{fullname}" 
                           placeholder="Dr. John Smith" id="fullname" />
                </div>
                <div class="form-group">
                    <label>Specialization</label>
                    <select th:field="*{specialization}" id="specialization">
                        <option value="">Select</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Neurology">Neurology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="General">General</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" 
                           th:field="*{phone}" 
                           placeholder="Phone number"  id="phone"/>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" 
                           th:field="*{email}" 
                           placeholder="Email" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" 
                           th:field="*{qualification}" 
                           placeholder="e.g. MBBS, MD" />
                </div>
                <div class="form-group">
                    <label>Experience (years)</label>
                    <input type="number" 
                           th:field="*{experience}" 
                           placeholder="0" id="experience" />
                </div>
                <div class="form-group">
                    <label>Consultation Fee</label>
                    <input type="number" 
                           th:field="*{fee}" 
                           placeholder="0.0" id="fee"/>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit" id="doctorBtn">Add Doctor</button>
                <a th:href="@{/doctors}">Cancel</a>
            </div>

        </form>
    </div>
</div>
</div>
<script th:src="@{/Script/script.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Appointment - HealthCare MS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="navbar">
    <span>❤️ HealthCare MS</span>
    <div><a th:href="@{/logout}">Logout</a></div>
</div>
<div class="wrapper">
<div class="sidebar">
    <div class="menu-title">MENU</div>
    <a th:href="@{/dashboard}">🏠 Dashboard</a>
    <div class="menu-title">PATIENTS</div>
    <a th:href="@{/patients}">All Patients</a>
    <a th:href="@{/patients/add}">Register Patient</a>
    <a th:href="@{/patients/search(keyword='')}">Search Patient</a>
    <div class="menu-title">DOCTORS</div>
    <a th:href="@{/doctors}">All Doctors</a>
    <a th:href="@{/doctors/add}">Add Doctor</a>
    <div class="menu-title">APPOINTMENTS</div>
    <a th:href="@{/appointments}">All Appointments</a>
    <a th:href="@{/appointments/book}">Book Appointment</a>
</div>
<div class="main">
    <h1>Edit Appointment</h1>
    <div class="form-box">
        <form th:action="@{/appointments/edit/{id}(id=${appointment.id})}"
              th:object="${appointment}"
              method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Patient</label>
                    <select th:field="*{patient}">
                        <option value="">Select Patient</option>
                        <option th:each="p : ${patients}"
                                th:value="${p.id}"
                                th:text="${p.fullName}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Doctor</label>
                    <select th:field="*{doctor}">
                        <option value="">Select Doctor</option>
                        <option th:each="d : ${doctors}"
                                th:value="${d.id}"
                                th:text="${d.fullname}">
                        </option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" th:field="*{date}"/>
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" th:field="*{time}"/>
                </div>
            </div>
            <div class="form-group">
                <label>Reason</label>
                <input type="text" th:field="*{reason}" placeholder="Reason for visit"/>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select th:field="*{status}">
                    <option value="Scheduled">Scheduled</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea th:field="*{notes}" placeholder="Additional notes"></textarea>
            </div>
            <div class="form-buttons">
                <button type="submit">Update Appointment</button>
                <a th:href="@{/appointments}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</div>
<script th:src="@{/Script/script.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment - HealthCare MS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="navbar">
    <span>❤️ HealthCare MS</span>
    <div>
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>

<div class="wrapper">

<div class="sidebar">
    <div class="menu-title">MENU</div>
    <a th:href="@{/dashboard}">🏠 Dashboard</a>
    <div class="menu-title">PATIENTS</div>
    <a th:href="@{/patients}">All Patients</a>
    <a th:href="@{/patients/add}">Register Patient</a>
    <a th:href="@{/patients/search}">Search Patient</a>
    <div class="menu-title">DOCTORS</div>
    <a th:href="@{/doctors}">All Doctors</a>
    <a th:href="@{/doctors/add}">Add Doctor</a>
    <div class="menu-title">APPOINTMENTS</div>
    <a th:href="@{/appointments}">All Appointments</a>
    <a th:href="@{/appointments/book}">Book Appointment</a>
</div>

<div class="main">
    <h1>Book Appointment</h1>

    <div class="form-box">
        <form id="appointmentForm"
              th:action="@{/appointments/book}"
              th:object="${appointment}"
              method="post">

            <div class="form-row">
                <div class="form-group">
                    <label>Patient</label>
                    <select id="patient" 
                            th:field="*{patient}">
                        <option value="">
                            Select Patient
                        </option>
                        <option th:each="p : ${patients}"
                                th:value="${p.id}"
                                th:text="${p.fullName}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Doctor</label>
                    <select id="doctor"
                            th:field="*{doctor}">
                        <option value="">
                            Select Doctor
                        </option>
                        <option th:each="d : ${doctors}"
                                th:value="${d.id}"
                                th:text="${d.fullname}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date"
                           id="date"
                           th:field="*{date}" />
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time"
                           id="time"
                           th:field="*{time}" />
                </div>
            </div>

            <div class="form-group">
                <label>Reason</label>
                <input type="text"
                       id="reason"
                       th:field="*{reason}"
                       placeholder="Reason for visit" />
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea th:field="*{notes}"
                          placeholder="Additional notes">
                </textarea>
            </div>

            <div class="form-buttons">
                <button type="submit"
                        id="appointmentBtn">
                    Book Appointment
                </button>
                <a th:href="@{/appointments}">Cancel</a>
            </div>

        </form>
    </div>
</div>
</div>
<script th:src="@{/Script/script.js}"></script>
</body>
</html>
